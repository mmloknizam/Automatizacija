spring.application.name=SpringRestAppDemo
server.servlet.context-path=/nst2025demo

spring.datasource.url=jdbc:mysql://mysql:3306/nst2025
spring.datasource.username=root
spring.datasource.password=root

# swagger
springdoc.swagger-ui.path=/test-ui.html

# liquibase
spring.liquibase.change-log=classpath:/liquibase/mysql/db-changelog-master.xml
spring.liquibase.url=jdbc:mysql://mysql:3306/nst2025
spring.liquibase.user=root
spring.liquibase.password=root

#spring.liquibase.enabled=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl